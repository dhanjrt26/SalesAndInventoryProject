spring.config.import=optional:file:.env[.properties]
spring.application.name=sales-inventory-api

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.xqqovgnuoebtjmnnclnd}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.supabase.url=${SUPABASE_URL:https://xqqovgnuoebtjmnnclnd.supabase.co}
app.supabase.anon-key=${SUPABASE_ANON_KEY:}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_AUTH_ISSUER:https://xqqovgnuoebtjmnnclnd.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://xqqovgnuoebtjmnnclnd.supabase.co/auth/v1/.well-known/jwks.json}

server.port=${PORT:8094}
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
